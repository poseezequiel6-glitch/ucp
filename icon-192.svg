<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ed760"/>
      <stop offset="100%" stop-color="#1db954"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1db954" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="180" height="180" rx="34" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Wave Bars in Center -->
  <g filter="url(#glow)">
    <rect x="42" y="78" width="14" height="36" rx="7" fill="url(#greenGrad)"/>
    <rect x="66" y="52" width="14" height="88" rx="7" fill="url(#greenGrad)"/>
    <rect x="90" y="38" width="14" height="116" rx="7" fill="url(#greenGrad)"/>
    <rect x="114" y="60" width="14" height="72" rx="7" fill="url(#greenGrad)"/>
    <rect x="138" y="84" width="14" height="24" rx="7" fill="url(#greenGrad)"/>
  </g>
</svg>
