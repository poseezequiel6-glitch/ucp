<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="greenGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ed760"/>
      <stop offset="100%" stop-color="#1db954"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1db954" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad512)"/>
  <rect x="16" y="16" width="480" height="480" rx="94" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  
  <!-- Wave Bars in Center -->
  <g filter="url(#glow512)">
    <rect x="110" y="208" width="38" height="96" rx="19" fill="url(#greenGrad512)"/>
    <rect x="174" y="140" width="38" height="232" rx="19" fill="url(#greenGrad512)"/>
    <rect x="238" y="100" width="38" height="312" rx="19" fill="url(#greenGrad512)"/>
    <rect x="302" y="160" width="38" height="192" rx="19" fill="url(#greenGrad512)"/>
    <rect x="366" y="224" width="38" height="64" rx="19" fill="url(#greenGrad512)"/>
  </g>
</svg>
